server:
  port: 8006

spring:
  application:
    name: market-service

  grpc:
    server:
      port: 9090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

market:
  provider:
    coingecko:
      base-url: https://api.coingecko.com/api/v3
      api-key: ${COINGECKO_API_KEY}