server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: register-rout
              uri: lb://auth-service
              predicates:
                - Path=/registering/**,/auth/**
            - id: user-route
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
            - id: email-route
              uri: lb://EMAIL-SERVICE
              predicates:
                - Path=/email/**
            - id: wallet-route
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/wallet/**    -

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

crypto:
  security:
    jwt:
      secret-key: ${SECRET_KEY}
