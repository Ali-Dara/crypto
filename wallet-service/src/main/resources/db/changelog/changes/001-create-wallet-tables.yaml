databaseChangeLog:

  - changeSet:
      id: 001-create-assets
      author: dara

      changes:
        - createTable:
            tableName: assets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: symbol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-wallets
      author: dara

      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-wallet-balances
      author: dara

      changes:
        - createTable:
            tableName: wallet_balances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: available_balance
                  type: DECIMAL(38,18)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: locked_balance
                  type: DECIMAL(38,18)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: asset_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: wallet_balances
            baseColumnNames: wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_wallet_balance_wallet

        - addForeignKeyConstraint:
            baseTableName: wallet_balances
            baseColumnNames: asset_id
            referencedTableName: assets
            referencedColumnNames: id
            constraintName: fk_wallet_balance_asset

        - addUniqueConstraint:
            tableName: wallet_balances
            columnNames: wallet_id, asset_id
            constraintName: uk_wallet_balance_wallet_asset

  - changeSet:
     id: 004-create-deposit
     author: dara

     changes:
       - createTable:
           tableName: deposits
           columns:
             - column:
                 name: id
                 type: BIGINT
                 autoIncrement: true
                 constraints:
                   primaryKey: true
                   nullable: false

             - column:
                 name: amount
                 type: DECIMAL(38,18)
                 constraints:
                   nullable: false

             - column:
                 name: status
                 type: VARCHAR(30)
                 constraints:
                   nullable: false

             - column:
                 name: wallet_id
                 type: BIGINT
                 constraints:
                   nullable: false

             - column:
                 name: asset_id
                 type: BIGINT
                 constraints:
                   nullable: false

             - column:
                 name: created_at
                 type: TIMESTAMP
                 constraints:
                   nullable: false

             - column:
                 name: updated_at
                 type: TIMESTAMP
                 constraints:
                   nullable: false

       - addForeignKeyConstraint:
           baseTableName: deposits
           baseColumnNames: wallet_id
           referencedTableName: wallets
           referencedColumnNames: id
           constraintName: fk_deposits_wallet

       - addForeignKeyConstraint:
           baseTableName: deposits
           baseColumnNames: asset_id
           referencedTableName: assets
           referencedColumnNames: id
           constraintName: fk_deposits_asset


  - changeSet:
      id: 005-create-envers-revinfo
      author: dara

      changes:
        - createTable:
            tableName: revinfo
            columns:
              - column:
                  name: rev
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: revtstmp
                  type: BIGINT


  - changeSet:
      id: 006-create-deposits-aud
      author: dara

      changes:
        - createTable:
            tableName: deposits_aud
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: SMALLINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(38,18)

              - column:
                  name: status
                  type: VARCHAR(30)

              - column:
                  name: wallet_id
                  type: BIGINT

              - column:
                  name: asset_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

        - addPrimaryKey:
            tableName: deposits_aud
            columnNames: id, rev
            constraintName: pk_deposits_aud

        - addForeignKeyConstraint:
            baseTableName: deposits_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_deposits_aud_rev

  - changeSet:
      id: 007-create-wallet-balances-aud
      author: dara

      changes:
        - createTable:
            tableName: wallet_balances_aud
            columns:

              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: SMALLINT
                  constraints:
                    nullable: false

              - column:
                  name: available_balance
                  type: DECIMAL(38,18)

              - column:
                  name: locked_balance
                  type: DECIMAL(38,18)

              - column:
                  name: wallet_id
                  type: BIGINT

              - column:
                  name: asset_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

        - addPrimaryKey:
            tableName: wallet_balances_aud
            columnNames: id, rev
            constraintName: pk_wallet_balances_aud

        - addForeignKeyConstraint:
            baseTableName: wallet_balances_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_wallet_balances_aud_rev

  - changeSet:
      id: 008-fix-revinfo-sequence-increment
      author: dara

      changes:
        - sql:
            sql: ALTER SEQUENCE revinfo_seq INCREMENT BY 50;


  - changeSet:
      id: 009-create-withdrawal
      author: dara

      changes:
        - createTable:
            tableName: withdrawals
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(38,18)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: asset_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

        - addForeignKeyConstraint:
            baseTableName: withdrawals
            baseColumnNames: wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_withdrawal_wallet

        - addForeignKeyConstraint:
            baseTableName: withdrawals
            baseColumnNames: asset_id
            referencedTableName: assets
            referencedColumnNames: id
            constraintName: fk_withdrawal_asset

  - changeSet:
      id: 006-create-withdrawals-aud
      author: dara

      changes:
        - createTable:
            tableName: withdrawals_aud
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: SMALLINT
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(38,18)

              - column:
                  name: status
                  type: VARCHAR(30)

              - column:
                  name: wallet_id
                  type: BIGINT

              - column:
                  name: asset_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: UUID

              - column:
                  name: updated_by
                  type: UUID

        - addPrimaryKey:
            tableName: withdrawals_aud
            columnNames: id, rev
            constraintName: pk_withdrawals_aud

        - addForeignKeyConstraint:
            baseTableName: withdrawals_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_withdrawals_aud_rev