databaseChangeLog:

  - changeSet:
      id: 001-create-assets
      author: dara

      changes:
        - createTable:
            tableName: assets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: symbol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-wallets
      author: dara

      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-wallet-balances
      author: dara

      changes:
        - createTable:
            tableName: wallet_balances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: available_balance
                  type: DECIMAL(38,18)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: locked_balance
                  type: DECIMAL(38,18)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: wallet_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: asset_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: wallet_balances
            baseColumnNames: wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_wallet_balance_wallet

        - addForeignKeyConstraint:
            baseTableName: wallet_balances
            baseColumnNames: asset_id
            referencedTableName: assets
            referencedColumnNames: id
            constraintName: fk_wallet_balance_asset

        - addUniqueConstraint:
            tableName: wallet_balances
            columnNames: wallet_id, asset_id
            constraintName: uk_wallet_balance_wallet_asset