server:
  port: 8005

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://localhost:5002/wallet-db
    username: admin
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

crypto:
  security:
    jwt:
      secret-key: ${SECRET_KEY}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}